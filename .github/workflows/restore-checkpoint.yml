name: Restore Super Dukie checkpoint

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify and unpack checkpoint
        shell: python
        run: |
          import hashlib, json, pathlib, zipfile

          root = pathlib.Path.cwd()
          archive = root / 'Super-Dukie-Central-Checkpoint.zip'

          with zipfile.ZipFile(archive) as z:
              manifest = json.loads(z.read('CHECKPOINT-MANIFEST.json'))
              pending = []

              for entry in manifest['files']:
                  relative = pathlib.PurePosixPath(entry['path'])
                  assert not relative.is_absolute()
                  assert '..' not in relative.parts
                  assert relative.parts[0] not in ('.git', '.github')

                  data = z.read('super-dukie/' + str(relative))
                  assert len(data) == entry['size']
                  assert hashlib.sha256(data).hexdigest() == entry['sha256']

                  target = root.joinpath(*relative.parts)
                  if target.exists() and target.read_bytes() != data:
                      assert (
                          str(relative) == 'README.md'
                          and target.read_text().strip() == '# super-dukie'
                      ), 'Existing file conflict: ' + str(relative)

                  pending.append((target, data))

              for target, data in pending:
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)

          status_path = root / 'PROJECT-STATUS.json
